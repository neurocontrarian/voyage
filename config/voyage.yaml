# Voyage surveillé. Pour un autre voyage, il suffit de modifier ce fichier.

nom: Portugal printemps 2027

origine: YUL                    # Montréal-Trudeau
destinations: [LIS, OPO]        # Lisbonne, Porto (grandes villes du Portugal continental)
villes_differentes: true        # arriver dans une ville et repartir d'une autre

# Scénarios surveillés : chacun a sa meilleure offre, ses alertes et son record.
# Dates : départ de Montréal (depart_du / depart_au) et arrivée à Montréal (retour_du / retour_au).
# Les vols vers l'Europe partent le soir et arrivent le lendemain matin ; nuits_min compte les
# nuits sur place. escales_max : escales permises sur chaque trajet (aller, retour).
scenarios:
  - nom: départ le 25 mars, retour le 2 avril, vol direct
    depart_du: 2027-03-25
    depart_au: 2027-03-25
    retour_du: 2027-04-02
    retour_au: 2027-04-02
    escales_max: 0
  - nom: au moins 6 nuits, départ dès le 25 mars, retour au plus tard le 3 avril, vol direct
    depart_du: 2027-03-25
    retour_au: 2027-04-03
    nuits_min: 6
    escales_max: 0
  - nom: départ le 25 mars, retour le 2 avril, 1 escale permise
    depart_du: 2027-03-25
    depart_au: 2027-03-25
    retour_du: 2027-04-02
    retour_au: 2027-04-02
    escales_max: 1
  - nom: au moins 6 nuits, départ dès le 25 mars, retour au plus tard le 3 avril, 1 escale permise
    depart_du: 2027-03-25
    retour_au: 2027-04-03
    nuits_min: 6
    escales_max: 1

passagers: 3                    # 2 adultes + 1 ado de 14 ans (tarif adulte dès 12 ans)
bagages_soute: 2                # nombre total de valises en soute pour le groupe
devise: CAD

# Règles des escales (scénarios qui en permettent).
escales:
  correspondance_min_minutes: 60
  correspondance_max_minutes: 180
  # Temps de vol (hors attente en correspondance) toléré au-delà d'un vol direct.
  temps_de_vol_en_plus_max_minutes: 120
  # Durée d'un vol direct de référence, pour mesurer le détour.
  duree_vol_direct_minutes: {aller: 400, retour: 450}

recherche:
  # Les nombres ci-dessous valent pour les vols directs, et à nouveau pour les vols avec escale.
  allers_detailles: 4           # nb d'allers dont on va chercher les retours (par date et ville)
  allers_simples_combines: 3    # nb de meilleurs allers simples combinés entre eux
  verifier_tarif_de_base: 5     # nb de meilleurs résultats re-vérifiés par scénario (tarif « base » ou non)

alerte:
  baisse_min: 25                # $ : écart minimal pour signaler un nouveau meilleur prix
  echecs_avant_alerte: 3        # exécutions ratées d'affilée avant de signaler une panne
  top: 5                        # nb d'options listées par scénario dans dernier_resultat.md
